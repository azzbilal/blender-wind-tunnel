# Pure-module unittest suite (no Blender, no WSL, no OpenFOAM), same command as in README "Development".
name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - run: python -m unittest discover -s tests -v
